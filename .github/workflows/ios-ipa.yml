# 产出未签名 IPA：准备引擎 → 编译 iSH → 编译 Flutter 设备包 → 打包 Payload。
# 不签名（无证书），拿到后用 TrollStore / Sideloadly / AltStore 自签安装。
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
      # 放在 checkout 外面：prepare-inputs.py 拒绝仓库内路径，同时便于缓存
      DSH_IOS_ENGINE_WORK: ${{ github.workspace }}/../engine-work

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 环境自检
        run: |
          uname -sm
          xcodebuild -version
          python3 --version
          rustc --version || true
          df -h /

      # ---------------- 缓存 ----------------
      - name: 恢复引擎缓存
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../engine-work
          key: ${{ runner.os }}-engine-${{ hashFiles('runtime/ohos/package/composition.json', 'tooling/ios/prepare-engine.sh') }}
          restore-keys: |
            ${{ runner.os }}-engine-

      - name: 恢复 iSH 缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            app/ios/Engine/ish-cache
            app/ios/Engine/build/iphoneos/guest
          key: ${{ runner.os }}-ish-${{ hashFiles('tooling/ios/ish/**', 'runtime/ios/guest/native/**') }}
          restore-keys: |
            ${{ runner.os }}-ish-

      # ---------------- Flutter ----------------
      - name: 安装 Flutter
        run: |
          set -euo pipefail
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          if [ ! -f "$RUNNER_TEMP/$archive" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          fi
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/flutter"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: 解析依赖
        run: |
          set -euo pipefail
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      # ---------------- 引擎 ----------------
      - name: 准备内嵌引擎
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/prepare.log"
          if ! bash tooling/ios/prepare-engine.sh 2>&1 | tee "$log"; then
            tail -n 15 "$log" | cut -c1-800 | sed -e 's/%/%25/g' -e 's/^/::error title=prepare-engine::/'
            exit 1
          fi
          ls -la app/ios/Engine
          test -f app/ios/Engine/.ready

      - name: 保存引擎缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../engine-work
          key: ${{ runner.os }}-engine-${{ hashFiles('runtime/ohos/package/composition.json', 'tooling/ios/prepare-engine.sh') }}

      # ---------------- iSH 工具链 ----------------
      # Xcode 的 Run Script 阶段用自己那套 PATH，GITHUB_PATH 不生效，
      # 所以把工具软链到 /usr/local/bin（Xcode 默认搜索路径）。
      - name: 安装 iSH 构建工具并挂到默认路径
        run: |
          set -euo pipefail
          brew install llvm lld meson ninja
          LLVM="$(brew --prefix llvm)/bin"
          LLD="$(brew --prefix lld)/bin"
          MESON="$(brew --prefix meson)/bin"
          NINJA="$(brew --prefix ninja)/bin"
          for tool in clang clang++ llvm-ar llvm-ranlib llvm-strip llvm-objcopy; do
            sudo ln -sfn "$LLVM/$tool" "/usr/local/bin/$tool"
          done
          sudo ln -sfn "$LLD/ld.lld" /usr/local/bin/ld.lld
          sudo ln -sfn "$MESON/meson" /usr/local/bin/meson
          sudo ln -sfn "$NINJA/ninja" /usr/local/bin/ninja
          echo "--- 验证 ---"
          command -v clang ld.lld meson ninja patch
          ld.lld --version
          meson --version
          ninja --version

      - name: 编译 iSH 设备端 framework
        run: |
          set -o pipefail
          out="app/ios/Engine/build/iphoneos/guest"
          log="$RUNNER_TEMP/ish-iphoneos.log"
          if ! bash tooling/ios/build-guest-addon.sh iphoneos "$out" 2>&1 | tee "$log"; then
            tail -n 25 "$log" | cut -c1-800 | sed -e 's/%/%25/g' -e 's/^/::error title=iSH build::/'
            exit 1
          fi
          for name in DshGuest DshGuestBridge; do
            binary="$out/$name.framework/$name"
            test -f "$binary"
            file "$binary"
            xcrun lipo "$binary" -verify_arch arm64
          done
          xcrun nm -gU "$out/DshGuestBridge.framework/DshGuestBridge" | grep 'napi_register_module_v1$'

      - name: 保存 iSH 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            app/ios/Engine/ish-cache
            app/ios/Engine/build/iphoneos/guest
          key: ${{ runner.os }}-ish-${{ hashFiles('tooling/ios/ish/**', 'runtime/ios/guest/native/**') }}

      # ---------------- Rust 原生库 ----------------
      - name: 预装 Rust iOS target
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target list --installed

      # ---------------- 编译 App ----------------
      - name: 编译 iOS App（未签名）
        working-directory: app
        env:
          # 主 target 由 --no-codesign 覆盖；CompanionWidget / ShareExtension 这类
          # 嵌套 target 仍会去要 DEVELOPMENT_TEAM，用这几个变量一起压住。
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          EXPANDED_CODE_SIGN_IDENTITY: ""
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/xcode-build.log"
          if bash ../tooling/ios/build.sh --release --no-codesign -v 2>&1 | tee "$log"; then
            echo "编译成功"
          else
            echo "::group::Xcode 真实错误"
            grep -nE "error:|\\*\\* BUILD FAILED \\*\\*|requires a provisioning|CodeSign .* failed|Undefined symbol|No valid iSH output" "$log" \
              | head -40 | sed -e 's/%/%25/g' -e 's/^/::error::/'
            echo "::endgroup::"
            echo "::group::日志尾部（150 行）"
            tail -150 "$log" | cut -c1-400
            echo "::endgroup::"
            cp "$log" "$RUNNER_TEMP/xcode-build-full.log"
            exit 1
          fi

      # ---------------- 打包 ----------------
      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP="$(find app/build/ios/iphoneos -maxdepth 1 -name '*.app' -type d | head -n1)"
          echo "选中: $APP"
          test -n "$APP"
          for f in NodeMobile DshNodeHost DshFlock DshRequireBuiltin DshGuest DshGuestBridge; do
            test -d "$APP/Frameworks/$f.framework" || { echo "::error::缺少 $f.framework"; exit 1; }
          done
          test -f "$APP/Frameworks/NodeMobile.framework/NodeMobile"
          test -f "$APP/Frameworks/DshGuestBridge.framework/DshGuestBridge"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry dsh-go-unsigned.ipa Payload
          ls -lh dsh-go-unsigned.ipa
          unzip -l dsh-go-unsigned.ipa | head -n 25

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-unsigned-ipa
          path: out/dsh-go-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 失败时留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ github.workspace }}/../engine-work/**/*.log
          if-no-files-found: ignore

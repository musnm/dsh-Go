# 每 6 小时检查上游 ccch1mneyyy/dsh-Go 是否有新提交。
# fork 仓库的 GITHUB_TOKEN 没有写权限（无法 push / 改 ref），
# 所以这里只做检测，检测到新提交就直接 workflow_dispatch 触发 ios-ipa.yml，
# 让它用 source_repo=上游 去拉源码编译。
name: Sync upstream

on:
  schedule:
    # 每 6 小时（UTC）：00:17 / 06:17 / 12:17 / 18:17，错开整点
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 触发 workflow_dispatch 需要

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: ccch1mneyyy/dsh-Go
  FORK: musnm/dsh-Go
  API: https://api.github.com

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: 检查上游是否有新提交
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh_get() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" "$1"; }

          UP="$(gh_get "$API/repos/$UPSTREAM/commits/main" | jq -r .sha)"
          CUR="$(gh_get "$API/repos/$FORK/commits/main" | jq -r .sha)"
          echo "上游 HEAD : $UP"
          echo "本地 HEAD : $CUR"
          echo "upstream_sha=$UP" >> "$GITHUB_OUTPUT"
          echo "current_sha=$CUR"  >> "$GITHUB_OUTPUT"

          # 上次编译过的上游 commit 记在变量里（用 Actions variable 存不了，
          # 所以改成：用上游 commit 是否已经存在于本仓库历史来判断）。
          # 上游不是本仓库祖先 → 说明没编过或上游又更新了。
          CMP="$(gh_get "$API/repos/$FORK/compare/$CUR...$UP")"
          ST="$(echo "$CMP" | jq -r .status)"
          AHEAD="$(echo "$CMP" | jq -r .ahead_by)"
          echo "compare: status=$ST ahead=$AHEAD"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

          if [ "$ST" = "identical" ] || [ "$ST" = "behind" ]; then
            echo "本仓库已包含上游最新代码，无需编译"
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游领先 $AHEAD 个提交，触发编译"
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 iOS IPA 编译（用上游源码）
        if: steps.chk.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/disp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/repos/$FORK/actions/workflows/ios-ipa.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"source_repo\":\"$UPSTREAM\",\"source_ref\":\"${{ steps.chk.outputs.upstream_sha }}\"}}")"
          echo "dispatch HTTP $CODE"
          cat /tmp/disp.json; echo
          [ "$CODE" = "204" ] || { echo "::error title=触发失败::HTTP $CODE"; exit 1; }
          echo "已触发编译：$UPSTREAM@${{ steps.chk.outputs.upstream_sha }}"

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 上游同步检查"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 HEAD | \`${{ steps.chk.outputs.upstream_sha }}\` |"
            echo "| 本仓库 HEAD | \`${{ steps.chk.outputs.current_sha }}\` |"
            echo "| 上游领先 | ${{ steps.chk.outputs.ahead || '0' }} |"
            echo "| 是否触发编译 | ${{ steps.chk.outputs.need }} |"
          } >> "$GITHUB_STEP_SUMMARY"
